<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3F5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#150E12" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Body Tea"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png">
</head><body>
<title>Body Tea 150</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column; hero with today's day count, sticky tab bar, one panel per tab, bottom-sheet recipe view, full-screen workout coach */
:root{
  --bg:#F7F3F5; --surface:#FFFFFF; --sunk:#F0E8EC; --ink:#26161F; --muted:#6F5C67; --line:#E6D9E0;
  --accent:#AE2763; --accent-ink:#FFFFFF; --accent-soft:#F7DCE7; --ok:#2E7B58; --ok-soft:#D9EFE4; --warn:#9A6212; --warn-soft:#F6E8CF; --sky:#2F6FA3; --sky-soft:#DCE9F5;
  --c0:#EFE6EB; --c1:#F2C6D7; --c2:#DE84A8; --c3:#AE2763; --scrim:rgba(38,22,31,.45);
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150E12; --surface:#20161C; --sunk:#2A1E25; --ink:#F5EAF0; --muted:#B9A5B1; --line:#3A2A33;
  --accent:#F06D9F; --accent-ink:#22101A; --accent-soft:#3F1E2D; --ok:#62C798; --ok-soft:#183427; --warn:#E6B05C; --warn-soft:#3A2B14; --sky:#7DB6E6; --sky-soft:#1A2B3A;
  --c0:#2C2027; --c1:#55283B; --c2:#8F3A60; --c3:#F06D9F; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#150E12; --surface:#20161C; --sunk:#2A1E25; --ink:#F5EAF0; --muted:#B9A5B1; --line:#3A2A33;
  --accent:#F06D9F; --accent-ink:#22101A; --accent-soft:#3F1E2D; --ok:#62C798; --ok-soft:#183427; --warn:#E6B05C; --warn-soft:#3A2B14; --sky:#7DB6E6; --sky-soft:#1A2B3A;
  --c0:#2C2027; --c1:#55283B; --c2:#8F3A60; --c3:#F06D9F; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:30px}
h3{font-size:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding-block:8px 18px}
.hero h1{font-size:clamp(46px,11vw,76px);letter-spacing:-.01em}
.hero h1 em{color:var(--accent)}
.hero .sub{margin-top:8px;color:var(--muted);max-width:42ch}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .t b{font-family:var(--display);font-size:34px;font-weight:400;display:block}
.ring .t span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.stat .l{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ring{width:88px;height:88px}.ring .t b{font-size:28px}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin-bottom:14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{display:grid;gap:16px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.sky{background:var(--sky-soft);color:var(--sky)}
.pill.plain{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:18px}
.btn:disabled{opacity:.5;cursor:default}
.sync{font-size:12px;color:var(--muted)}
.linkish{background:none;border:0;color:var(--accent);font-weight:700;padding:0}

/* day nav */
.daynav{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center}
.daynav .mid{text-align:center}
.daynav .mid b{font-family:var(--display);font-size:32px;font-weight:400;display:block;line-height:1}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}

/* checklist */
.checks{display:grid;gap:2px;margin-top:6px}
.chk{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:8px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .lab{font-weight:600}
.chk .hint{font-size:13px;color:var(--muted);font-weight:500}
.chk.done .lab{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.group-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:14px}

/* workout */
.ex{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.ex:first-of-type{border-top:0}
.ex .n{font-family:var(--display);font-size:22px;color:var(--accent);line-height:1}
.ex .nm{font-weight:700}
.ex .cue{font-size:13px;color:var(--muted)}
.ex .rx{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;text-align:right}
.ex .eq{font-size:11px;color:var(--muted);text-align:right;font-weight:600}
.note{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px}
.note b{color:var(--ink)}

/* food logging */
.dash{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:18px;align-items:center;margin-top:12px}
@media (max-width:560px){.dash{grid-template-columns:auto auto}.dash .waterbox{grid-column:1 / -1}}
.rg{width:96px;height:96px;position:relative}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.rg .t b{font-size:18px;font-variant-numeric:tabular-nums;display:block}
.rg .t span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.water{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.glass{width:24px;height:32px;border:2px solid var(--line);border-radius:4px 4px 9px 9px;background:var(--surface);padding:0;position:relative;overflow:hidden}
.glass.on{border-color:var(--sky);background:var(--sky-soft)}
.glass.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--sky);opacity:.55}
.menu{display:grid;margin-top:12px}
.slot{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.slot .nm{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink)}
.slot .nm:hover{color:var(--accent)}
.slot .mac{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .acts{display:flex;gap:6px}
.slot.ate .nm{color:var(--muted)}
.eat{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center}
.eat[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.eat[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.qadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:10px}
@media (max-width:520px){.qadd{grid-template-columns:1fr 1fr}.qadd .field:first-child{grid-column:1 / -1}}
.totals{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.totals b{font-size:18px}

/* inputs */
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:1fr}}
.choices{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* calendar */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.cell{aspect-ratio:1;border:0;border-radius:9px;background:var(--c0);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);display:grid;place-items:center;position:relative;max-width:100%}
.cell.p1{background:var(--c1)}.cell.p2{background:var(--c2);color:var(--accent-ink)}.cell.p3{background:var(--c3);color:var(--accent-ink)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.future{opacity:.55}
.cell.rest::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.cell.period::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--warn)}

/* charts + tables */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}

/* progress */
.coachbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.grade{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:40px;background:var(--accent-soft);color:var(--accent)}
.grade.A{background:var(--ok-soft);color:var(--ok)}.grade.C,.grade.D{background:var(--warn-soft);color:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
@media (max-width:520px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.metrics div{background:var(--surface);padding:10px 12px;min-width:0}
.metrics b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.metrics span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.badge{border-radius:12px;padding:12px;background:var(--sunk);color:var(--muted)}
.badge b{display:block;font-size:14px}
.badge span{font-size:12px}
.badge .ic{font-family:var(--display);font-size:26px;line-height:1;display:block;margin-bottom:4px;opacity:.5}
.badge.on{background:var(--accent-soft);color:var(--ink)}
.badge.on .ic{color:var(--accent);opacity:1}

/* plan */
.week{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk .d{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.phases{grid-template-columns:1fr}}
.phase{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.phase.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.phase .d{font-size:12px;color:var(--muted);font-weight:700}
.tl{display:grid;gap:0;margin-top:6px}
.tli{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.tli:first-child{border-top:0}
.tli .w{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.tli.big .w,.tli.big .x b{color:var(--accent)}
@media (max-width:480px){.tli{grid-template-columns:1fr;gap:2px}}
ul.clean{margin:6px 0 0;padding-left:18px}
ul.clean li{margin:5px 0}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.goal{border-radius:12px;background:var(--sunk);padding:12px 14px}
.goal b{display:block;font-size:15px}
.goal span{font-size:13px;color:var(--muted)}

/* food */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:600px){.meals{grid-template-columns:1fr}}
.meal{background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;min-width:0}
.meal .open{background:none;border:0;padding:0;text-align:left;display:block;width:100%;color:var(--ink)}
.meal .t{font-weight:700}
.meal .open:hover .t{color:var(--accent)}
.meal .s{font-size:13px;color:var(--muted)}
.meal .mac{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.meal .mac span{color:var(--muted);font-weight:600}
.meal .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.fav{border:0;background:none;font-size:20px;line-height:1;padding:2px;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--accent)}
.count{font-size:13px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:grid;align-items:end;justify-items:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);border:0;padding:0;cursor:default}
.sheet-card{position:relative;background:var(--surface);color:var(--ink);width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding-block:20px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@media (min-width:720px){.sheet{align-items:center}.sheet-card{border-radius:20px;max-height:86vh}}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet h2{font-size:34px;margin-top:4px}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.macros div{background:var(--surface);padding:10px 12px;min-width:0}
.macros b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.macros span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:10px;background:var(--sunk)}
.mbar i{display:block;height:100%}
.mkey{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.mkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ings{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:0}
.ings li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ings li:last-child{border-bottom:0}
.ings li.txt{color:var(--muted)}
.use{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.groc .chk{padding:8px 2px}

/* coach */
.coach{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cwrap{max-width:640px;margin:0 auto;display:grid;gap:14px}
.cbig{font-family:var(--display);font-size:clamp(34px,9vw,52px);line-height:1}
.crx{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.bigbtn{width:100%;padding:16px;font-size:17px;border-radius:14px}
.tring{width:220px;height:220px;margin:6px auto;position:relative}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}

function phaseFor(cd,avg,plen,on){

function cycleInfo(){return cached("cyc",()=>{
  const pd=Object.keys(state.journal).map(Number).filter(onPeriodDay).sort((a,b)=>a-b), set=new Set(pd), starts=[];
  if(state.cyc0)starts.push(dayOfDate(parseD(state.cyc0)));
  pd.forEach(d=>{if(!set.has(d-1)&&!set.has(d-2)&&!starts.some(s=>Math.abs(s-d)<15))starts.push(d)});
  starts.sort((a,b)=>a-b);
  if(!starts.length)return null;
  const lens=[];for(let i=1;i<starts.length;i++)lens.push(starts[i]-starts[i-1]);
  const valid=lens.filter(L=>L>=21&&L<=45);
  const avg=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):state.cycLen;
  const plens=starts.map(s=>{let n=0;while(set.has(s+n))n++;return n}).filter(n=>n>0);
  const plen=plens.length?Math.max(3,Math.min(8,Math.round(plens.reduce((a,b)=>a+b,0)/plens.length))):5;

})}

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=800, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=.82,d=c.toDataURL("image/jpeg",q);
    while(d.length>180000&&q>.35){q-=.08;d=c.toDataURL("image/jpeg",q)}
    if(d.length>180000){const c2=document.createElement("canvas");c2.width=Math.round(c.width*.7);c2.height=Math.round(c.height*.7);c2.getContext("2d").drawImage(c,0,0,c2.width,c2.height);d=c2.toDataURL("image/jpeg",.7)}
    return d;
  }finally{URL.revokeObjectURL(url)}
}

  let slot;
  if(r.c==="breakfast"){m.b=id;slot="b"}else if(r.c==="lunch"){m.l=id;slot="l"}else if(r.c==="fruit"){m.f=id;slot="f"}else{if(m.s.length<2){m.s.push(id);slot="s"+(m.s.length-1)}else{m.s[1]=id;slot="s1"}}
  state.menus[view]=m; const e=state.eaten[view];if(e){const i=e.indexOf(slot);if(i>=0)e.splice(i,1)}
  save(); closeSheet(); showTab("today"); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------------- workout coach ---------------- */
let coach=null;
function fmtS(s){return s>=60?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):String(s)}
function holdSecs(rx){if(/steps/i.test(rx))return null;let m=rx.match(/(\d+)\s*min/);if(m)return +m[1]*60;m=rx.match(/(\d+)\s*s\b/);return m?+m[1]:null}
function buildSession(day,kk,pp){
  const k=kk||effKey(day), w=W[k], ph=pp!=null?pp:phaseOf(day), list=w.phases[Math.min(ph,w.phases.length-1)], steps=[];
  if(w.circuit){
    const rounds=w.circuit[ph];
    for(let r=1;r<=rounds;r++)list.forEach((e,i)=>{const t=holdSecs(e[1]);steps.push({ex:e[0],rx:e[1],eq:e[2],cue:i===0?"":e[3],label:`Round ${r} of ${rounds}`,timer:t,rest:i===list.length-1&&r<rounds?w.rest:(i===list.length-1?0:10),move:i})});
  }else{
    list.forEach((e,i)=>{const m=e[1].match(/^(\d+)\s*×\s*(.+)$/);let sets=m?+m[1]:1;const rx=m?m[2]:e[1];let t=holdSecs(rx);const side=t&&/side/.test(rx);
      const n=side?sets*2:sets;
      for(let s=1;s<=n;s++)steps.push({ex:e[0],rx:rx,eq:e[2],cue:e[3],label:side?`Set ${Math.ceil(s/2)} of ${sets} · ${s%2?"left":"right"} side`:`Set ${s} of ${sets}`,timer:t,rest:s<n?(side&&s%2?10:w.rest):(i<list.length-1?Math.max(20,w.rest-15):0),move:i})});
  }
  if(hasCore(k))CORE_LIST.forEach((e,i)=>steps.push({ex:e[0],rx:e[1],eq:e[2],cue:e[3],label:"Core finisher",timer:holdSecs(e[1]),rest:i<CORE_LIST.length-1?15:0,move:100+i}));
  return steps;
}
function startCoach(day,kk,pp){
  coach={day,k:kk||effKey(day),preview:!!kk,steps:buildSession(day,kk,pp),i:0,mode:"work",end:0,dur:0,started:Date.now(),tick:null,ac:null,wake:null,exitArm:false};
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC)coach.ac=new AC()}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>{if(coach)coach.wake=l;else l.release()}).catch(()=>{})}catch(e){}
  $("#coach").hidden=false;document.body.style.overflow="hidden";renderCoach();
}
function stopCoach(){
  if(!coach)return;clearInterval(coach.tick);try{coach.wake&&coach.wake.release()}catch(e){}try{coach.ac&&coach.ac.close()}catch(e){}
  coach=null;$("#coach").hidden=true;document.body.style.overflow="";
}
function beep(n){if(!coach||!coach.ac)return;try{const ac=coach.ac;for(let i=0;i<(n||1);i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.25;o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.22)}}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function countdown(secs,mode){
  coach.mode=mode;coach.dur=secs;coach.end=Date.now()+secs*1000;clearInterval(coach.tick);renderCoach();
  coach.tick=setInterval(()=>{if(!coach)return;const left=Math.max(0,Math.ceil((coach.end-Date.now())/1000));
    const el=$("#c-left"),arc=$("#c-arc");if(el)el.textContent=fmtS(left);
    if(arc)arc.setAttribute("stroke-dashoffset",(578*(1-(left/coach.dur))).toFixed(1));
    if(left<=0){clearInterval(coach.tick);beep(mode==="hold"?2:1);if(coach.mode==="hold")setDone();else nextStep()}},250);
}
function setDone(){const st=coach.steps[coach.i];if(st.rest>0&&coach.i<coach.steps.length-1)countdown(st.rest,"rest");else nextStep()}
function nextStep(){clearInterval(coach.tick);coach.i++;if(coach.i>=coach.steps.length){coach.mode="done";finishCoach()}else{coach.mode="work"}renderCoach()}
function finishCoach(){if(coach.preview)return;const d=coach.day;addCheck(d,"workout");if(hasCore(effKey(d)))addCheck(d,"core");commit()}
function renderCoach(){
  if(!coach)return;
  const w=W[coach.k], N=coach.steps.length;
  if(coach.mode==="done"){
    const mins=Math.max(1,Math.round((Date.now()-coach.started)/60000));
    $("#coach-in").innerHTML=`<div class="row between"><div class="eyebrow">${esc(w.title)}</div><button class="btn small" data-coach="close">Close</button></div>
     <div class="cbig" style="margin-top:30px">Workout done.</div><p class="muted" style="font-size:17px">${N} sets in ${mins} minutes. ${coach.preview?"That was a preview, so nothing was ticked off.":`Your workout${hasCore(coach.k)?" and core finisher are":" is"} ticked off for day ${coach.day}.`}</p>
     <div class="note"><b>Next:</b> protein within the next couple of hours, a big glass of water, and keep moving toward 15k steps.</div>
     <button class="btn primary bigbtn" data-coach="close">Back to today</button>`;
    return;
  }
  const st=coach.steps[coach.i], g=guideFor(st.ex), nx=coach.steps[coach.i+1];
  const prog=coach.i/N*100;
  let h=`<div class="row between"><div class="eyebrow">${esc(w.title)} · step ${coach.i+1} of ${N}</div><button class="btn small" data-coach="exit">${coach.exitArm?"Tap again to exit":"Exit"}</button></div>
   <div class="bar"><i style="width:${prog}%"></i></div>${prToast?`<div class="note" style="background:var(--ok-soft)"><b style="color:var(--ok)">★ ${esc(prToast)}</b></div>`:""}`;prToast="";
  if(coach.mode==="rest"){
    h+=`<div class="eyebrow" style="text-align:center;margin-top:16px">Rest</div>
     <div class="tring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--sunk)" stroke-width="12"/><circle id="c-arc" cx="100" cy="100" r="92" fill="none" stroke="var(--sky)" stroke-width="12" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="0"/></svg><div class="t"><div><b id="c-left">${fmtS(coach.dur)}</b><span>rest</span></div></div></div>
     <div class="row" style="justify-content:center"><button class="btn" data-coach="plus">+15 s</button><button class="btn primary" data-coach="skip">Skip rest</button></div>
     ${nx?`<div class="card"><div class="eyebrow">Up next · ${esc(nx.label)}</div><div style="font-weight:800;font-size:18px;margin-top:4px">${esc(nx.ex)}</div><div class="muted">${esc(nx.rx)} · ${esc(nx.eq)}</div></div>`:""}`;
  }else{
    h+=`<div><div class="eyebrow" style="color:var(--accent)">${esc(st.label)}</div><div class="cbig" style="margin-top:6px">${esc(st.ex)}</div>
      <div class="row" style="margin-top:8px"><span class="crx">${esc(st.rx)}</span><span class="pill plain">${esc(st.eq)}</span></div>${st.cue?`<p class="muted" style="margin:6px 0 0">${esc(st.cue)}</p>`:""}</div>`;
    if(coach.mode==="hold"){
      h+=`<div class="tring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="var(--sunk)" stroke-width="12"/><circle id="c-arc" cx="100" cy="100" r="92" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="0"/></svg><div class="t"><div><b id="c-left">${fmtS(coach.dur)}</b><span>hold</span></div></div></div>
       <button class="btn bigbtn" data-coach="setdone">Finished early</button>`;
    }else if(st.timer){
      h+=`<button class="btn primary bigbtn" data-coach="hold">Start ${st.timer>=60?Math.round(st.timer/60)+" min":st.timer+" s"} timer</button><button class="btn bigbtn" data-coach="setdone">Done</button>`;
    }else{
      h+=logInputs(st)+`<button class="btn primary bigbtn" data-coach="setdone">Done set ✓</button>`;
    }
    if(g)h+=`<div class="card guide"><div class="eyebrow">Form guide</div><dl style="margin:0">
       <dt>Set up</dt><dd>${esc(g.s)}</dd><dt>Move</dt><dd><ol>${g.h.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></dd>
       <dt>Feel it in</dt><dd>${esc(g.f)}</dd><dt>Avoid</dt><dd>${esc(g.m)}</dd></dl></div>`;
    if(nx&&coach.mode!=="hold")h+=`<p class="upnext">Next: ${esc(nx.ex)} · ${esc(nx.label)}</p>`;
  }
  $("#coach-in").innerHTML=h;
}
document.getElementById("coach").addEventListener("click",e=>{
  const b=e.target.closest("[data-coach]");if(!b||!coach)return;const a=b.dataset.coach;
  if(a!=="exit")coach.exitArm=false;
  if(a==="exit"){if(coach.exitArm)stopCoach();else{coach.exitArm=true;renderCoach();setTimeout(()=>{if(coach&&coach.exitArm){coach.exitArm=false;if(coach.mode!=="rest"&&coach.mode!=="hold")renderCoach()}},3000)}}
  else if(a==="close")stopCoach();
  else if(a==="setdone"){clearInterval(coach.tick);logSet();setDone()}
  else if(a==="hold"){try{coach.ac&&coach.ac.resume()}catch(e){}countdown(coach.steps[coach.i].timer,"hold")}
  else if(a==="skip"){nextStep()}
  else if(a==="plus"){coach.end+=15000;coach.dur+=15}
});

function wkDay(td,i){let d=td-mod7(td)+i;while(d<15)d+=7;return d}
function safe(f){try{f()}catch(e){console.error(e)}}

const dirtyTabs=new Set(Object.keys(RENDER));

let navTop=null;
function showTab(t){
  if(!RENDER[t])t="today";
  const changed=t!==tab;tab=t;try{localStorage.setItem(LS+":tab",t)}catch(e){}
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  document.querySelectorAll(".panel").forEach(p=>p.hidden=p.id!=="p-"+t);
  if(dirtyTabs.has(t))renderTab(t);
  if(changed)requestAnimationFrame(()=>{const nav=document.querySelector(".tabs");if(!nav)return;if(navTop==null)navTop=nav.offsetTop;if(window.scrollY>navTop)window.scrollTo({top:navTop-2})});
}
function paint(){safe(renderHeader);if(dirtyTabs.has(tab))renderTab(tab)}

  else if(a==="logw"){const d=clampDay(+$("#lw-day").value||1),kg=parseFloat($("#lw-kg").value);if(kg>30&&kg<250){state.weights[d]=Math.round(kg*10)/10;if(isWeigh(d))addCheck(d,"weigh");commit()}else{$("#lw-kg").focus()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target&&e.target.id==="ask-in"){e.preventDefault();const q=e.target.value;e.target.value="";askRun(q);return}if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest("g.fz")){e.preventDefault();e.target.closest("g.fz").dispatchEvent(new MouseEvent("click",{bubbles:true}));return}if(e.key!=="Escape")return;if(coach){if(coach.exitArm)stopCoach();else{coach.exitArm=true;renderCoach()}}else if(sheetMode)closeSheet()});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.chk){const id=t.dataset.chk,c=state.checks[view]||(state.checks[view]=[]);const i=c.indexOf(id);if(t.checked&&i<0)c.push(id);if(!t.checked&&i>=0)c.splice(i,1);commitT("list","nav");return}
  if(t.hasAttribute("data-steps")){const v=parseInt(t.value);if(v>=0&&v<=80000){state.steps[view]=v;if(v>=15000)addCheck(view,"steps")}else delete state.steps[view];commitT("rings","list","nav");return}
  if(t.dataset.prom){const a=state.promChk,i=a.indexOf(t.dataset.prom);if(t.checked&&i<0)a.push(t.dataset.prom);if(!t.checked&&i>=0)a.splice(i,1);commit();return}
  if(t.dataset.actv){const a=state.skin.act,k=t.dataset.actv,i=a.indexOf(k);if(t.checked&&i<0)a.push(k);if(!t.checked&&i>=0)a.splice(i,1);commit();return}
  if(t.dataset.groc){const g=state.groc[grocStart]||(state.groc[grocStart]=[]);const i=g.indexOf(t.dataset.groc);if(t.checked&&i<0)g.push(t.dataset.groc);if(!t.checked&&i>=0)g.splice(i,1);save();openGroc(grocStart);return}
  if(t.dataset.jin){const j=J0(view);const k=t.dataset.jin;if(k==="sl"){const v=parseFloat(t.value);if(v>=0&&v<=14)j.sl=v;else delete j.sl}else{const v=t.value.trim().slice(0,200);if(v)j.no=v;else delete j.no}cleanJ(view);save();return}
  if(t.hasAttribute("data-weight")){const v=parseFloat(t.value);if(v>30&&v<250){state.weights[view]=Math.round(v*10)/10;addCheck(view,"weigh")}else delete state.weights[view];commitT("list","nav");return}
  if(t.dataset.meas){const m=state.meas[view]||(state.meas[view]={});const v=parseFloat(t.value);if(v>0)m[t.dataset.meas]=v;else delete m[t.dataset.meas];if(Object.keys(m).length)addCheck(view,"measure");commitT("list","nav");return}
  if(t.id==="start-in"&&t.value){state.start=t.value;view=clampDay(todayDay());save();renderAll();return}
  if(t.id==="cyc0"){state.cyc0=t.value||"";commit();return}
  if(t.id==="cyclen"){const v=+t.value;if(v>=21&&v<=45){state.cycLen=v;commit()}return}
  if(t.id==="cmp-a"){cmpA=+t.value;renderTab("progress");return}
  if(t.id==="cmp-b"){cmpB=+t.value;renderTab("progress");return}
  if(t.id==="up-file"&&t.files&&t.files[0]){uploadPhoto(t.files[0]);return}
  if(t.id==="bk-file"&&t.files&&t.files[0]){const f=t.files[0];f.text().then(txt=>{bkPending=txt;bkArm=false;bkMsg="Backup file \""+f.name+"\" is ready. Tap Restore, then tap again to confirm.";renderTab("plan");const b=document.querySelector('[data-act="bkrestore"]');if(b)b.scrollIntoView({block:"center"})},()=>{bkMsg="Couldn't read that file.";renderTab("plan")});return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="pick-q"){pickQ=e.target.value;clearTimeout(window.__pq);window.__pq=setTimeout(()=>{const pl=$("#pick-list");if(pl)pl.innerHTML=pickListHTML()},120)}
  if(e.target.id==="food-q"){foodQ=e.target.value;foodShow=40;clearTimeout(window.__fq);window.__fq=setTimeout(()=>{const fl=$("#food-list");if(fl)fl.innerHTML=renderFoodList()},120)}
  if(e.target.id==="cmp-x"){cmpX=+e.target.value;const c=$("#cmp");if(c)c.style.setProperty("--x",cmpX+"%")}
});

renderAll();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
